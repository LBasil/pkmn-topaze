<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanto 151 – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script src="app.js"></script><script src="data/pokedex.js"></script><script src="data/meta.js"></script><script>
const M=document.getElementById("m"),C=META.coverage;

table("t",K,[{h:"#",get:k=>k.p.n,num:1},{h:"name",first:1,get:k=>L(k.p.name),html:k=>pLink(k.p.name,k.p.n,1)},{h:"type",get:k=>k.p.types.join(),html:k=>k.p.types.map(tb).join("")},{h:"source",get:k=>k.src,html:k=>({wild:t("wildc"),gift:t("gift"),evo:t("evoonly"),"?":"?"})[k.src]},{h:"places",get:k=>nloc(k),num:1},{h:"top",get:k=>k.w.length?L(k.w[0].loc):"",html:k=>k.w.length?`${esc(L(k.w[0].loc))} (${k.w[0].pct}%)`:"—"}],{max:160,filters:[{label:t("source"),values:[["wild",t("wildc")],["gift",t("gift")],["evo",t("evoonly")]],test:(k,f)=>k.src===f}]});nav("kanto");
