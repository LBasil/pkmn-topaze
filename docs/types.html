<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Type chart – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Type chart</h1><p class="mut">Attacker on the left, defender on top. <span class="t x2">2×</span> <span class="t x05">½×</span> <span class="t x0">0×</span>. The new <b>Fairy</b> type follows the usual rules (strong vs Fighting/Dragon/Dark, resisted by Fire/Poison/Steel).</p><div class="wrap" id="c"></div></main>
