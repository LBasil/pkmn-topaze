<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movedex – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script src="app.js"></script><script src="data/moves.js"></script><script src="data/pokedex.js"></script><script>
const M=document.getElementById("m");
function list(){M.innerHTML=`<h1>${t("movedex")}</h1><p class="mut">${lang==="fr"?"Toutes les attaques avec leur type Topaze. Chaque attaque est <b>physique ou spéciale en elle-même</b> (comme en 4ᵉ génération). <b>Coupe, Force, Éclate-Roc et Flash</b> sont de vraies attaques. Clique sur une attaque pour voir qui l’apprend.":"All moves with their Topaze type. Each move is <b>physical or special on its own</b> (Gen 4 style). <b>Cut, Strength, Rock Smash and Flash</b> are real attacks. Click a move to see who learns it."}</p><div id="t"></div>`;
table("t",MOVES,[{h:"name",get:x=>L(x.name),html:x=>mLink(x.name)},{h:"type",get:x=>x.type,html:x=>tb(x.type)},{h:"category",get:x=>x.cat,html:x=>catn(x.cat)},{h:"power",get:x=>x.power,num:1,html:x=>x.power||"—"},{h:"acc",get:x=>x.acc,num:1,html:x=>x.acc||"—"},{h:"pp",get:x=>x.pp,num:1},{h:"prio",get:x=>x.prio,num:1},{h:"CT/CS",get:x=>x.tm},{h:"effect",get:x=>L(x.desc),html:x=>`<span class="mut" style="white-space:normal;display:block;min-width:280px">${esc(L(x.desc))}</span>`}],
{max:700,filters:[{label:t("all_types"),values:Object.keys(COL).map(v=>[v,tn(v)]),test:(x,f)=>x.type===f},{label:t("category"),values:[["Physical",catn("Physical")],["Special",catn("Special")],["Status",catn("Status")]],test:(x,f)=>x.cat===f}]})}
function detail(name){const m=MOVES.find(x=>x.name.en===name);if(!m)return list();
 const lvl=[],tm=[],egg=[];for(const p of POKEDEX){const a=p.moves.filter(x=>x[1].en===name).map(x=>x[0]);if(a.length)lvl.push([p,a[0]]);if(p.tm.some(x=>x.move.en===name))tm.push(p);if(p.eggmoves.some(x=>x.en===name))egg.push(p)}
 const ch=(a,f)=>a.map(x=>{const p=f?x[0]:x;return `<a class="chip" href="pokedex.html#${p.n}">${esc(L(p.name))}${f?` <span class="mut">${t("lv")}${x[1]}</span>`:""}</a>`}).join("")||"—";
 M.innerHTML=`<p><a href="movedex.html">${t("back")}</a></p><h1>${esc(L(m.name))} ${tb(m.type)}</h1><p class="mut">${esc(lang==="fr"?m.name.en:m.name.fr)}${m.tm?` · <b>${m.tm}</b>`:""}</p><p>${esc(L(m.desc))}</p>
 <table class="kv"><tr><td>${t("category")}</td><td>${catn(m.cat)}</td></tr><tr><td>${t("power")}</td><td>${m.power||"—"}</td></tr><tr><td>${t("acc")}</td><td>${m.acc||"—"}</td></tr><tr><td>${t("pp")}</td><td>${m.pp}</td></tr><tr><td>${t("prio")}</td><td>${m.prio}</td></tr><tr><td>Contact</td><td>${m.contact?"✔":"—"}</td></tr></table>
 ${m.tmsrc&&m.tmsrc.length?`<h2>${t("obtain")} ${m.tm}</h2><ul>${m.tmsrc.map(x=>`<li>${t("k_"+x.kind)} — ${esc(L(x.loc))}</li>`).join("")}</ul>`:m.tm?`<h2>${t("obtain")} ${m.tm}</h2><p class="mut">${t("nosrc")}</p>`:""}<h2>${t("learners")} — ${t("level")}</h2><p>${ch(lvl,1)}</p>${tm.length?`<h2>${m.tm}</h2><p>${ch(tm)}</p>`:""}<h2>${t("egg")}</h2><p>${ch(egg)}</p>`;window.scrollTo(0,0)}
function route(){const h=decodeURIComponent(location.hash.slice(1));h?detail(h):list()}
window.onhashchange=route;route();nav("movedex");
</script></body></html>
