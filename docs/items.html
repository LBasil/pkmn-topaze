<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Items – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script src="app.js"></script><script src="data/items.js"></script><script>
const M=document.getElementById("m");
M.innerHTML=`<h1>${t("itemsn")}</h1><p class="mut">${lang==="fr"?"Tous les objets du jeu et où les obtenir (objets au sol, objets cachés, cadeaux de PNJ, boutiques, lots). Les CT/CS indiquent leur attaque. Les objets sans source connue sont obtenus autrement (dresseurs, objets tenus, événements).":"Every item in the game and where to get it (ground items, hidden items, NPC gifts, shops, prizes). TMs and HMs show their move. Items with no known source are obtained another way (trainers, held items, events)."}</p><div id="t"></div>`;
const P=[...new Set(ITEMS.map(x=>x.pocket))].map(p=>[p,pk(p)]);
const srcTxt=x=>x.src.length?x.src.map(s=>`<span class="badge">${t("k_"+s.kind)}</span> ${esc(L(s.loc))}`).join("<br>"):'<span class="mut">—</span>';
table("t",ITEMS,[{h:"name",get:x=>L(x.name)},{h:"pocket",get:x=>x.pocket,html:x=>pk(x.pocket)},{h:"price",get:x=>x.price,num:1,html:x=>x.price||"—"},{h:"effect",get:x=>L(x.desc),html:x=>`<span class="mut" style="white-space:normal;display:block;min-width:260px">${esc(L(x.desc))}</span>`},{h:"obtain",get:x=>x.src.length,html:x=>`<span style="white-space:normal;display:block;min-width:220px">${srcTxt(x)}</span>`}],{max:400,filters:[{label:t("pocket"),values:P,test:(x,f)=>x.pocket===f},{label:t("obtain"),values:[["ground",t("k_ground")],["hidden",t("k_hidden")],["gift",t("k_gift")],["shop",t("k_shop")],["prize",t("k_prize")]],test:(x,f)=>x.src.some(s=>s.kind===f)}]});nav("items");
</script></body></html>
