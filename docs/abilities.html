<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c9731a"><title>Abilities – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
