<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainers – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script src="app.js"></script><script src="data/trainers.js"></script><script>
const M=document.getElementById("m");
M.innerHTML=`<h1>${t("trainers")}</h1><p class="mut">${lang==="fr"?"Tous les dresseurs placés sur les cartes, avec leur lieu et leur équipe. Un nom entre parenthèses indique un objet tenu ; si aucune attaque n’est listée, le Pokémon connaît les attaques par défaut de son niveau. Les champions d’arène ont leur propre page.":"Every trainer placed on the maps, with location and team. An item in parentheses is held; when no moves are listed the Pokémon uses its default level-up moves. Gym champions have their own page."}</p><div id="t"></div>`;
const place=[...new Set(TRAINERS.map(x=>x.loc.en))].sort().map(en=>[en,L(TRAINERS.find(x=>x.loc.en===en).loc)]).sort((a,b)=>a[1].localeCompare(b[1]));
const team=x=>x.team.map(m=>`<a class="sp" href="pokedex.html#${m.n||""}">${esc(L(m.sp))}</a>`).join("");
table("t",TRAINERS,[{h:"class",get:x=>L(x.cls)},{h:"name",get:x=>x.name,first:1,html:x=>`<b id="${x.id}">${esc(x.name)}</b>`},{h:"location",get:x=>L(x.loc),html:x=>placeLink(x.map,x.loc)},{h:"levels",get:x=>Math.max(...x.team.map(m=>m.lvl)),num:1,html:x=>{const l=x.team.map(m=>m.lvl);return Math.min(...l)==Math.max(...l)?l[0]:Math.min(...l)+"–"+Math.max(...l)}},{h:"team",get:x=>x.team.map(m=>L(m.sp)).join(","),html:x=>`<span style="display:block;min-width:300px">${x.team.map(m=>`<span class="chip">${pimg(m.n)}<b>${esc(L(m.sp))}</b> <span class="mut">${t("lv")}${m.lvl}${m.item?` (${esc(L(m.item))})`:""}</span></span>`).join("")}${x.dbl?` <span class="badge">${lang==="fr"?"double":"double"}</span>`:""}</span>`}],{max:80,hashSearch:1,filters:[{label:t("location"),values:place,test:(x,f)=>x.loc.en===f}]});nav("trainers");
</script></body></html>
