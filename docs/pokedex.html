<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Pokédex</h1><p class="mut">The 151 Kanto Pokémon with their <b>Topaze types</b>, base stats and level-up moves. Click a column to sort.</p><div id="t"></div><div id="d"></div></main>
<script src="app.js"></script><script src="data/pokedex.js"></script><script src="data/types.js"></script><script>
const T=TYPES.list;
table("t",POKEDEX,[{h:"#",get:x=>x.n,num:1},{h:"Name",get:x=>x.name,html:x=>`<a href="#" onclick="show(${x.n-1});return false">${x.name}</a>`},{h:"Type",get:x=>x.types.join(),html:x=>x.types.map(tb).join("")},{h:"HP",get:x=>x.stats[0],num:1},{h:"Atk",get:x=>x.stats[1],num:1},{h:"Def",get:x=>x.stats[2],num:1},{h:"SpA",get:x=>x.stats[3],num:1},{h:"SpD",get:x=>x.stats[4],num:1},{h:"Spe",get:x=>x.stats[5],num:1},{h:"BST",get:x=>x.bst,num:1},{h:"Abilities",get:x=>x.abilities.join(" / ")}],{filter:{label:"All types",values:T,test:(x,f)=>x.types.includes(f)}});
function show(i){const p=POKEDEX[i];document.getElementById("d").innerHTML=`<h2>#${p.n} ${p.name} ${p.types.map(tb).join("")}</h2><p class="mut">Level-up moves</p><div class="wrap"><table><tr><th>Lv.</th><th>Move</th></tr>${p.moves.map(m=>`<tr><td class="n">${m[0]}</td><td>${m[1]}</td></tr>`).join("")}</table></div>`;document.getElementById("d").scrollIntoView({behavior:"smooth"})}
</script><script>nav('pokedex')</script></body></html>
