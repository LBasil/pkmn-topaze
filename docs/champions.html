<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Champions – Pokémon Topaze</title><link rel="stylesheet" href="style.css"></head><body><main id="m"></main>
<script src="app.js"></script><script src="data/champions.js"></script><script>
const M=document.getElementById("m");
M.innerHTML=`<h1>${t("champions")}</h1><p class="mut">${lang==="fr"?"Les huit champions, dans l’ordre où tu les croises. Les niveaux sont ceux des données du jeu.":"The eight champions, in the order you meet them. Levels are those set in the game data."}</p><div class="cards">${CHAMPIONS.map(c=>`<div class="card" id="${c.n}"><h3>${c.n}. ${esc(c.name)}</h3><div class="mut">${esc(c.city)} · ${c.type.split(" / ").map(tb).join("")}</div><ul class="team">${c.team.map(m=>`<li>${pimg(m.n)}<b>${esc(L(m.species))}</b> ${t("lv")} ${m.lvl}${m.item?` <span class="mut">@ ${esc(L(m.item))}</span>`:""}<br><span class="mut">${m.moves.map(L).join(" · ")}</span></li>`).join("")}</ul></div>`).join("")}</div>`;nav("champions");
</script></body></html>
